name: EB AI Avatar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing key
        env:
          KEY_BASE64: ${{ secrets.AI_BOY_KEYSTORE_BASE64 }}
          AI_BOY_KEYSTORE_PASSWORD: ${{ secrets.AI_BOY_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEY_BASE64" && test -n "$AI_BOY_KEYSTORE_PASSWORD" || { echo "Missing signing secrets"; exit 1; }
          mkdir -p signing
          printf '%s' "$KEY_BASE64" | base64 --decode > signing/ai-boy.p12
      - name: Bundle offline MediaPipe Face Landmarker model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' \
            -o app/src/main/assets/face_landmarker.task
          test "$(wc -c < app/src/main/assets/face_landmarker.task)" -gt 1000000
      - name: Build signed release APK
        env:
          AI_BOY_KEYSTORE_PASSWORD: ${{ secrets.AI_BOY_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Ai-boy-V1.1-MediaPipe-offline-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
